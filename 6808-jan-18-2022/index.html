## Assemblages vs Lines

<!-- .slide: data-background-image="lines.png" -->

img: via unsplash.com [Ryan Stone](https://unsplash.com/photos/_4MkAq-Aycg)
<!-- .element: class="references" -->

<aside class="notes"><p>lines travel; when they intersect with other lines they form knots.  Lines go along together: they correspond;</p>
<p>&quot;And as things carry on together, and answer to one another, they do not<br>so much interact as correspond. Interaction is the dynamic of the<br>assemblage, where things are joined up. But correspondence is a<br>joining with; it is not additive but contrapuntal, not ‘and...and...and’<br>but ‘with...with...with&quot; <a href="https://knowingfromtheinside.org/files/correspondences.pdf">https://knowingfromtheinside.org/files/correspondences.pdf</a> p12</p>
<p>wikipedia&#39;s handy: &quot;Assemblage theory asserts that, within a body, the relationships of component parts are not stable and fixed; rather, they can be displaced and replaced within and among other bodies, thus approaching systems through relations of exteriority.1(<a href="https://en.wikipedia.org/wiki/Assemblage_(philosophy)#cite_note-UT2016-1)&quot;&quot;">https://en.wikipedia.org/wiki/Assemblage_(philosophy)#cite_note-UT2016-1)&quot;&quot;</a></p>
</aside></script></section><section  data-markdown><script type="text/template">

## But that still won't make you a 'digital' historian

- Key thing: if, as part of your historical approach, you are considering the impact of how digital technologies represent ( <i>RE</i>-present) historical materials **or** you are using your historical sensibility to question our current technomoment

.... you *might* be a digital historian
</script></section><section data-markdown><script type="text/template">

# So what is 'good digital history'?

<aside class="notes"><ul>
<li>can not be made &#39;equivalent&#39; to print outputs or their digital skeumorphs.</li>
<li>it&#39;s not about what becomes known but how we come to know them. thus the goal posts are always changing. once you could digitize something and it was transformative; but now that merely counts as good basic practice <em>unless the material hasn&#39;t been digitized before</em> . But then you have to discuss and think about how that process happened: see quoth the raven by Ryan Cordell</li>
<li>often can be public facing; but the &#39;authority&#39; of the interface always has to be critiqued</li>
<li>it takes risks; productive/glorious failures</li>
<li>the code is valuable and ought be considered a research output/publication in its own right</li>
<li>the information we work with, when ethically/legally possible, should also be availalbe; failing that, perhaps our notes (caleb mcdaniel open notebook data)</li>
<li>it discusses what works, what hasn&#39;t, and the implications</li>
<li>it enables others to build on it in meaningful ways (not just simple line items in the lit review) - it permits new ways of seeing, new questions</li>
</ul>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: data-background-image="fail.png" -->
